name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Sign APK with Debug Key
        run: |
          # Find the built unsigned apk and sign it so Android accepts it
          ANDROID_HOME=$HOME/android-sdk
          # Usingapksigner or just copying to debug-signed
          # Actually, easiest way for testing is assembling debug or signing release with debug keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ~/.android/debug.keystore -storepass android -keypass android app/build/outputs/apk/release/app-release-unsigned.apk androiddebugkey

      - name: Rename Signed APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Simple-Feet-Inch-Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Feet-Inch-Calculator-APK
          path: app/build/outputs/apk/release/Simple-Feet-Inch-Calculator.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Feet-Calculator-AAB
          path: app/build/outputs/bundle/release/*.aab
          
